{% extends "base.html" %}
{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div style="max-width:560px; margin:0 auto;">
  <div class="admin-nav" style="display:flex; gap:.8rem; margin-bottom:1.5rem;">
    <a href="{{ url_for('users.show') }}"
       class="btn btn-outline" style="padding:.45rem 1.1rem;">← Volver</a>
    <strong style="font-size:1rem; color:var(--azul);">
      {{ '✏ Editar usuario' if accion == 'edit' else '➕ Nuevo usuario' }}
    </strong>
  </div>

  <div class="card">
    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST" novalidate>

      <div class="field-group">
        <label class="field-label" for="fullname">Nombre completo</label>
        <input type="text" name="fullname" id="fullname"
               value="{{ user.fullname if user else '' }}"
               placeholder="Ej: María García" required>
      </div>

      <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
        <div class="field-group">
          <label class="field-label" for="username">Nombre de usuario</label>
          <input type="text" name="username" id="username"
                 value="{{ user.username if user else '' }}"
                 placeholder="Ej: mgarcia" required>
        </div>
        <div class="field-group">
          <label class="field-label" for="role">Rol</label>
          <select name="role" id="role">
            {% for r in roles %}
            <option value="{{ r }}"
              {{ 'selected' if user and user.role == r else '' }}>
              {{ r | title }}
            </option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="field-group">
        <label class="field-label" for="email">Correo electrónico</label>
        <input type="email" name="email" id="email"
               value="{{ user.email if user else '' }}"
               placeholder="correo@ejemplo.com" required>
      </div>

      {% if accion == 'create' %}
      <div class="field-group">
        <label class="field-label" for="password">Contraseña</label>
        <input type="password" name="password" id="password"
               placeholder="Mínimo 8 caracteres" minlength="8" required>
      </div>

      {% else %}
      <div class="field-group">
        <label class="field-label" for="new_password">
          Nueva contraseña
          <span style="font-weight:400; color:var(--gris-medio);">
            (dejar vacío para no cambiarla)
          </span>
        </label>
        <input type="password" name="new_password" id="new_password"
               placeholder="Solo si deseas cambiarla" minlength="8">
      </div>
      {% endif %}

      <div style="display:flex; gap:1rem; margin-top:1.5rem;
                  padding-top:1.5rem; border-top:1px solid var(--gris-suave);">
        <button type="submit" class="btn btn-primary">
          {{ 'Guardar cambios' if accion == 'edit' else 'Crear usuario' }}
        </button>
        <a href="{{ url_for('users.show') }}"
           class="btn btn-outline">Cancelar</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
