{% extends "base.html" %}
{% block title %}Iniciar sesión{% endblock %}

{% block content %}
<div style="max-width:420px; margin:3rem auto;">
  <div class="card">
    <div style="text-align:center; margin-bottom:1.5rem;">
      <div style="font-size:2.5rem;">🔐</div>
      <h2 class="card-title" style="margin-top:.5rem;">Panel de investigación</h2>
      <p class="card-subtitle" style="margin-bottom:0;">Acceso restringido al equipo investigador</p>
    </div>

    {% if error %}
      <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="POST" novalidate>
      <div class="field-group">
        <label class="field-label" for="email">Correo electrónico</label>
        <input type="email" name="email" id="email"
               placeholder="tu@correo.com" autocomplete="email" required>
      </div>
      <div class="field-group">
        <label class="field-label" for="password">Contraseña</label>
        <input type="password" name="password" id="password"
               placeholder="••••••••" autocomplete="current-password" required>
      </div>
      <button type="submit" class="btn btn-primary" style="width:100%; margin-top:.5rem;">
        Iniciar sesión →
      </button>
    </form>

    <p style="text-align:center; margin-top:1.2rem; font-size:.82rem;">
      <a href="{{ url_for('auth.request_reset') }}"
         style="color:var(--azul-medio);">¿Olvidaste tu contraseña?</a>
    </p>
  </div>
</div>
{% endblock %}
